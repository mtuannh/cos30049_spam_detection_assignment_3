<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spam Email Detection</title>
  <link rel="stylesheet" href="src/styles/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>Spam Email Detection</h1>
    <nav>
      <button onclick="showTab('predict')">Predict</button>
      <button onclick="showTab('batch')">Batch</button>
      <button onclick="showTab('analytics')">Analytics</button>
      <button onclick="showTab('report')">Model Report</button>
    </nav>
  </header>

  <main>

    <section id="predict" class="tab active">
      <h2>Single Email Prediction</h2>
      <textarea id="singleText" placeholder="Paste your email content here..."></textarea>
      <button onclick="predictOne()">Detect Spam</button>
      <div id="singleResult"></div>
    </section>


    <section id="batch" class="tab">
      <h2>Batch Email Prediction</h2>
      <textarea id="batchText" placeholder="Paste multiple emails, one per line..."></textarea>
      <button onclick="predictBatch()">Predict All</button>
      <div id="batchResult"></div>
    </section>


    <section id="analytics" class="tab">
      <h2>Analytics Dashboard</h2>
      <div class="chart-container">
        <canvas id="chartPie"></canvas>
      </div>
      <div class="chart-container">
        <canvas id="chartHist"></canvas>
      </div>
      <div class="chart-container">
        <canvas id="chartLine"></canvas>
      </div>
      <button onclick="loadAnalytics()">🔄 Refresh Analytics</button>
    </section>

    <section id="report" class="tab">
      <h2>Model Performance Report</h2>
      <div id="reportContent"></div>
      <button onclick="loadReport()">🔄 Reload Report</button>
    </section>
  </main>

  <footer>
    <p>Spam Detection - Powered by FastAPI + ML Model</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
